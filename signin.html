<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Huntified — Sign In</title>
  <link href="./dist/output.css" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="min-h-screen bg-slate-50 text-slate-900 font-sans selection:bg-emerald-500 selection:text-white flex flex-col justify-between">
  <header class="sticky top-0 z-50 bg-white/85 backdrop-blur-md border-b border-slate-100">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2.5 group">
        <img src="image/huntified logo.png" alt="Huntified Logo" class="h-8 w-auto object-contain" />
      </a>
      <a href="signup.html" class="text-xs font-bold text-slate-700 bg-slate-100 hover:bg-slate-200 px-3.5 py-2 rounded-xl transition-all">
        Create account
      </a>
    </div>
  </header>

  <main class="max-w-md w-full mx-auto px-4 py-16 flex-grow flex items-center">
    <div class="bg-white p-8 rounded-3xl border border-slate-200/80 shadow-xl w-full space-y-6">
      <div class="space-y-2 text-center">
        <h1 class="text-2xl font-extrabold text-slate-900">Welcome back</h1>
        <p class="text-xs text-slate-500">Sign in to manage your rentals, escrow deposits, and property listings.</p>
      </div>

      <form id="login-form" class="space-y-4">
        <div class="space-y-1.5">
          <label for="username" class="text-xs font-semibold text-slate-700">Username or Email</label>
          <div class="relative">
            <input type="text" id="username" name="username" required placeholder="e.g. tunde_adeleke" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm text-slate-900 focus:outline-none focus:border-emerald-500 focus:bg-white transition-all pl-10" />
            <i data-lucide="user" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5"></i>
          </div>
        </div>

        <div class="space-y-1.5">
          <div class="flex items-center justify-between">
            <label for="password" class="text-xs font-semibold text-slate-700">Password</label>
            <a href="#" class="text-[11px] font-semibold text-emerald-600 hover:underline">Forgot password?</a>
          </div>
          <div class="relative">
            <input type="password" id="password" name="password" required placeholder="••••••••••••••••" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm text-slate-900 focus:outline-none focus:border-emerald-500 focus:bg-white transition-all pl-10 pr-12" />
            <i data-lucide="lock" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5"></i>
            <button type="button" id="toggle-password" class="absolute right-4 top-3.5 text-xs font-bold text-slate-400 hover:text-slate-700">Show</button>
          </div>
        </div>

        <button type="submit" id="submit-btn" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3.5 px-6 rounded-xl transition-all shadow-lg shadow-slate-900/10 text-sm flex items-center justify-center gap-2 mt-2">
          Sign In <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
      </form>

      <div class="text-center pt-2 text-xs text-slate-500">
        Don't have a Huntified account? <a href="signup.html" class="font-bold text-slate-900 underline">Sign up</a>
      </div>
    </div>
  </main>

  <footer class="bg-white border-t border-slate-100 py-8 text-center text-xs text-slate-400">
    <div>© 2026 Huntified Technologies Inc. All rights reserved.</div>
  </footer>

  <script>
    lucide.createIcons();
  </script>
  <script src="signin.js"></script>
</body>
</html>
